# motion daemon config: serves the USB webcam as an MJPEG stream for the laptop.
# Written for motion 4.3+ (Raspberry Pi OS Bookworm ships 4.5). Older 4.2 uses
# `videodevice` for `video_device`, `output_pictures` for `picture_output`, and
# `ffmpeg_output_movies` for `movie_output`.
# Run: motion -n -c rpi/motion.conf     Laptop opens http://<pi>:8081/
daemon off
setup_mode off

video_device /dev/video0
width 640
height 360
framerate 15

# No recording to disk; this is a live stream only.
picture_output off
movie_output off

# Stream
stream_port 8081
stream_localhost off
stream_maxrate 15
stream_quality 70
stream_motion off

# No web control interface
webcontrol_port 0
