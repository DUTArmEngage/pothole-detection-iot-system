<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashscreen</title>
<style>
  :root { --bg:#0f1419; --panel:#1a212b; --fg:#e6edf3; --muted:#8b98a5; --accent:#3fb950; --trail:#58a6ff; --warn:#f85149; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family: system-ui, sans-serif; overflow:hidden; }
  #wrap { display:grid; grid-template-rows:auto 1fr; height:100%; }
  header { display:flex; gap:16px; align-items:center; padding:8px 16px; background:var(--panel); font-size:18px; }
  header .spacer { flex:1; }
  #status { padding:2px 10px; border-radius:4px; font-weight:600; background:var(--accent); color:#04150a; }
  #status.stale { background:var(--warn); color:#fff; }
  canvas { width:100%; height:100%; display:block; }
  #stale-banner { display:none; position:absolute; top:56px; left:50%; transform:translateX(-50%); background:var(--warn); color:#fff; padding:8px 20px; border-radius:6px; font-size:22px; font-weight:700; }
  .stale #stale-banner { display:block; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <span id="status">NO FIX</span>
    <span id="pos">--</span>
    <span class="spacer"></span>
    <span id="motion">--</span>
  </header>
  <canvas id="map"></canvas>
  <div id="stale-banner">POSITION STALE</div>
</div>
<script>
const canvas = document.getElementById('map'), ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status'), posEl = document.getElementById('pos'), motionEl = document.getElementById('motion');

function fit() {
  const r = devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * r; canvas.height = canvas.clientHeight * r;
  ctx.setTransform(r, 0, 0, r, 0, 0);
}
addEventListener('resize', fit); fit();

function draw(g) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);
  const pts = g.trail.slice();
  if (!pts.length) return;
  let [minLat, maxLat, minLon, maxLon] = [Infinity, -Infinity, Infinity, -Infinity];
  for (const [la, lo] of pts) { minLat = Math.min(minLat, la); maxLat = Math.max(maxLat, la); minLon = Math.min(minLon, lo); maxLon = Math.max(maxLon, lo); }
  const pad = 40, lonScale = Math.cos((minLat + maxLat) / 2 * Math.PI / 180);
  const spanX = Math.max((maxLon - minLon) * lonScale, 1e-5), spanY = Math.max(maxLat - minLat, 1e-5);
  const s = Math.min((w - 2 * pad) / spanX, (h - 2 * pad) / spanY);
  const ox = (w - spanX * s) / 2, oy = (h - spanY * s) / 2;
  const xy = ([la, lo]) => [ox + (lo - minLon) * lonScale * s, oy + (maxLat - la) * s];

  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--trail');
  ctx.lineWidth = 3; ctx.beginPath();
  pts.forEach((p, i) => { const [x, y] = xy(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.stroke();

  const [x, y] = xy(pts[pts.length - 1]);
  ctx.fillStyle = g.stale ? '#f85149' : '#3fb950';
  ctx.beginPath(); ctx.arc(x, y, 10, 0, 2 * Math.PI); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
}

async function tick() {
  try {
    const { gps } = await (await fetch('/api/state', { cache: 'no-store' })).json();
    document.body.classList.toggle('stale', gps.stale);
    statusEl.classList.toggle('stale', gps.stale);
    statusEl.textContent = !gps.fix ? 'NO FIX' : gps.stale ? 'STALE' : 'LIVE';
    if (gps.fix) {
      posEl.textContent = `${gps.fix.lat.toFixed(5)}, ${gps.fix.lon.toFixed(5)}  (${gps.age_s.toFixed(1)} s ago)`;
      const sp = gps.fix.speed_kmh, hd = gps.fix.heading;
      motionEl.textContent = `${sp == null ? '--' : sp.toFixed(0)} km/h   ${hd == null ? '--' : hd.toFixed(0)}°`;
    }
    draw(gps);
  } catch (e) {
    statusEl.textContent = 'UI OFFLINE'; statusEl.classList.add('stale');
  }
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
