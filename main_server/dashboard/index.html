<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>
  :root { --bg:#0f1419; --panel:#1a212b; --fg:#e6edf3; --muted:#8b98a5; --warn:#f85149; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family: system-ui, sans-serif; }
  main { display:grid; gap:16px; padding:16px; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
  section { background:var(--panel); border-radius:8px; padding:12px 16px; }
  h2 { margin:0 0 8px; font-size:15px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
  #imu { width:100%; height:200px; display:block; }
  #imu-readout { margin-top:8px; font:14px ui-monospace, monospace; color:var(--muted); }
  #meta { font-size:13px; color:var(--muted); margin-top:4px; }
</style>
</head>
<body>
<main>
  <section>
    <h2>Live IMU</h2>
    <canvas id="imu"></canvas>
    <div id="imu-readout">waiting for IMU...</div>
    <div id="meta"></div>
  </section>
</main>
<script src="/imu_chart.js"></script>
<script>
async function tick() {
  try {
    const { imu, fake_imu } = await (await fetch('/api/state', { cache: 'no-store' })).json();
    drawImu(document.getElementById('imu'), imu, document.getElementById('imu-readout'));
    document.getElementById('meta').textContent =
      `${fake_imu ? 'simulated IMU' : 'Pi IMU'} · polls ${imu.polls} · missed windows ${imu.gaps}` + (imu.error ? ` · ${imu.error}` : '');
  } catch (e) {}
}
tick(); setInterval(tick, 200);
</script>
</body>
</html>
