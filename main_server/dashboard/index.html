<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pothole Dashboard</title>
<link rel="stylesheet" href="/vendor/leaflet.css">
<style>
  :root { --bg:#0f1419; --panel:#1a212b; --line:#2b3440; --fg:#e6edf3; --muted:#8b98a5;
          --ok:#3fb950; --warn:#d29922; --bad:#f85149; --accent:#58a6ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family: system-ui, sans-serif; }

  /* The page fills the window and never scrolls on a wide display, so it survives being
     dragged to another screen; below 900px wide the panels stack and the page scrolls. */
  body { height:100dvh; display:grid; grid-template-rows:auto minmax(0,1fr); gap:clamp(8px,1.2vh,16px); padding:clamp(8px,1.2vh,16px); overflow:hidden; }

  #hud { display:flex; flex-wrap:wrap; align-items:center; gap:clamp(12px,2vw,32px); background:var(--panel); border-radius:8px; padding:clamp(6px,1vh,12px) clamp(12px,1.5vw,24px); }
  .stat { display:flex; flex-direction:column; line-height:1.1; }
  .stat .v { font-size:clamp(24px,4.2vh,56px); font-weight:700; font-variant-numeric:tabular-nums; }
  .stat .v small { font-size:.45em; font-weight:500; color:var(--muted); margin-left:.25em; }
  .stat .k { font-size:clamp(10px,1.4vh,13px); color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  #pos { font:clamp(12px,1.8vh,16px) ui-monospace, monospace; color:var(--muted); }
  .spacer { flex:1; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-size:clamp(11px,1.6vh,14px); padding:3px 10px; border-radius:999px; background:#0f1419; border:1px solid var(--line); color:var(--muted); }
  .chip::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--muted); }
  .chip.ok::before { background:var(--ok); } .chip.warn::before { background:var(--warn); } .chip.bad::before { background:var(--bad); }
  #fs { font:inherit; font-size:clamp(11px,1.6vh,14px); color:var(--fg); background:transparent; border:1px solid var(--line); border-radius:6px; padding:3px 10px; cursor:pointer; }

  main { display:grid; gap:inherit; min-height:0; grid-template-columns:minmax(0,3fr) minmax(0,2fr); grid-template-rows:minmax(0,1.4fr) minmax(0,1fr); }
  section { background:var(--panel); border-radius:8px; padding:clamp(6px,1vh,12px) clamp(10px,1.2vw,16px); display:flex; flex-direction:column; min-height:0; min-width:0; }
  #video-panel { grid-row:1 / span 2; }
  h2 { margin:0 0 6px; font-size:clamp(11px,1.6vh,14px); color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em; display:flex; gap:12px; align-items:center; }
  h2 .legend { margin-left:auto; text-transform:none; letter-spacing:0; font-weight:400; display:flex; gap:10px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; }
  .box { position:relative; flex:1; min-height:0; }
  #video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; border-radius:4px; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  #map { position:absolute; inset:0; border-radius:4px; background:#1b232e; }
  .leaflet-container { font:12px system-ui, sans-serif; }
  #recenter { position:absolute; z-index:1000; right:10px; bottom:28px; font:12px system-ui; padding:4px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--fg); cursor:pointer; display:none; }
  .pin-pop img { width:220px; display:block; margin-top:6px; border-radius:4px; }
  .pin-pop b { text-transform:uppercase; }
  .foot { margin-top:6px; font:clamp(11px,1.5vh,13px) ui-monospace, monospace; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  @media (max-width: 900px) {
    body { height:auto; min-height:100dvh; overflow:auto; }
    main { grid-template-columns:1fr; grid-template-rows:none; }
    #video-panel { grid-row:auto; }
    .box { flex:none; height:56vw; max-height:60vh; }
  }
</style>
</head>
<body>
<header id="hud">
  <div class="stat"><span class="v" id="speed">--<small>km/h</small></span><span class="k">Speed</span></div>
  <div class="stat"><span class="v" id="heading">--<small id="compass"></small></span><span class="k">Heading</span></div>
  <div class="stat"><span class="v" id="count">0</span><span class="k">Pinned this run</span></div>
  <div class="stat"><span class="v" id="saved">0</span><span class="k">Saved in total</span></div>
  <a id="export" href="/api/pins.geojson" download style="color:var(--muted);font-size:13px">Export pins</a>
  <div id="pos">no position</div>
  <span class="spacer"></span>
  <span class="chip" id="chip-gps">GPS</span>
  <span class="chip" id="chip-imu">IMU</span>
  <span class="chip" id="chip-video">Video</span>
  <button id="fs" title="Toggle fullscreen (F)">Fullscreen</button>
</header>

<main>
  <section id="video-panel">
    <h2>Road video <span class="legend"><span><i class="dot" style="background:#3fb950"></i>low</span><span><i class="dot" style="background:#d29922"></i>medium</span><span><i class="dot" style="background:#f85149"></i>high</span></span></h2>
    <div class="box"><img id="video" src="/video.mjpg" alt="annotated road video"></div>
    <div class="foot" id="vmeta">video not started</div>
  </section>
  <section>
    <h2>Map <span class="legend" id="maplegend"></span></h2>
    <div class="box"><div id="map"></div><button id="recenter">Recenter</button></div>
  </section>
  <section>
    <h2>Live IMU</h2>
    <div class="box"><canvas id="imu"></canvas></div>
    <div class="foot" id="imu-readout">waiting for IMU...</div>
  </section>
</main>

<script src="/imu_chart.js"></script>
<script src="/vendor/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
const COMPASS = ['N','NE','E','SE','S','SW','W','NW'];
let last = null;

function chip(id, label, level, text) { const el = $(id); el.className = 'chip ' + level; el.textContent = text ? `${label} · ${text}` : label; }

function render(st) {
  const g = st.gps, v = st.video, imu = st.imu;
  if (g && g.fix) {
    const f = g.fix;
    $('speed').firstChild.nodeValue = f.speed_kmh == null ? '--' : f.speed_kmh.toFixed(0);
    $('heading').firstChild.nodeValue = f.heading == null ? '--' : f.heading.toFixed(0) + '°';
    $('compass').textContent = f.heading == null ? '' : COMPASS[Math.round(f.heading / 45) % 8];
    $('pos').textContent = `${f.lat.toFixed(5)}, ${f.lon.toFixed(5)}` + (f.accuracy_m != null ? `  ±${f.accuracy_m.toFixed(0)} m` : '');
    chip('chip-gps', 'GPS', g.stale ? 'bad' : 'ok', g.stale ? 'stale' : 'live');
  } else chip('chip-gps', 'GPS', g ? 'warn' : '', g ? 'waiting for fix' : 'off');

  const events = v ? v.events : [];
  if (!v || !v.events) $('count').textContent = 0;
  const n = { low: 0, medium: 0, high: 0 }; events.forEach(e => n[e.severity]++);
  $('maplegend').innerHTML = ['low:#3fb950', 'medium:#d29922', 'high:#f85149'].map(x => { const [k, c] = x.split(':'); return `<span><i class="dot" style="background:${c}"></i>${n[k]}</span>`; }).join('');
  if (g) updateMap(g, events, !v || v.saving !== false);

  if (st.imu_enabled === false) { chip('chip-imu', 'IMU', '', 'not used'); $('imu-readout').textContent = 'No IMU in this setup: severity uses box size and confidence'; }
  else drawImu($('imu'), imu, $('imu-readout'));
  if (st.imu_enabled !== false) chip('chip-imu', st.fake_imu ? 'IMU (sim)' : 'IMU', imu.stale ? 'bad' : 'ok', imu.stale ? (imu.error ? 'offline' : 'stale') : '');

  if (!v) { chip('chip-video', 'Video', '', 'off'); $('vmeta').textContent = 'detection off'; return; }
  chip('chip-video', 'Video', v.connected ? 'ok' : 'warn', v.connected ? '' : 'connecting');
  const l = v.recent[v.recent.length - 1];
  $('vmeta').textContent = (v.connected ? 'stream OK' : (v.error || 'connecting...')) + ` · ${v.fps} fps · ${v.latency_ms} ms/frame` +
    (l ? ` · last: ${l.severity.toUpperCase()} ${l.confidence}` : '');
}

// ---- Map: OpenStreetMap tiles around this laptop's position, with saved pothole pins ----
const SEV = { low: '#3fb950', medium: '#d29922', high: '#f85149' };
const map = L.map('map', { zoomControl: true, attributionControl: true }).setView([0, 0], 2);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
const trailLine = L.polyline([], { color: '#58a6ff', weight: 4, opacity: .8 }).addTo(map);
const me = L.circleMarker([0, 0], { radius: 9, color: '#fff', weight: 2, fillColor: '#58a6ff', fillOpacity: 1 });
const accuracy = L.circle([0, 0], { radius: 0, color: '#58a6ff', weight: 1, fillOpacity: .08 });
const pinLayer = L.layerGroup().addTo(map);
let follow = true, centred = false, pinKey = '';
map.on('dragstart zoomstart', e => { if (centred && e.type === 'dragstart') { follow = false; $('recenter').style.display = 'block'; } });
$('recenter').onclick = () => { follow = true; $('recenter').style.display = 'none'; if (lastLatLng) map.setView(lastLatLng, Math.max(map.getZoom(), 17)); };
let lastLatLng = null;

function updateMap(g, events, saving) {
  if (!g.fix) return;
  lastLatLng = [g.fix.lat, g.fix.lon];
  trailLine.setLatLngs(g.trail);
  if (!map.hasLayer(me)) { me.addTo(map); accuracy.addTo(map); }
  me.setLatLng(lastLatLng).setStyle({ fillColor: g.stale ? '#f85149' : '#58a6ff' });
  accuracy.setLatLng(lastLatLng).setRadius(g.fix.accuracy_m || 0);
  if (!centred) { map.setView(lastLatLng, 17); centred = true; }   // first fix: open on where the laptop is
  else if (follow) map.panTo(lastLatLng, { animate: true });
  if (saving) refreshPins(events.length); else showPins(events.map(e => ({ ...e, current: true })));
}

function showPins(pins) {
  pinLayer.clearLayers();
  for (const p of pins) {
    const m = L.circleMarker([p.lat, p.lon], { radius: 9, color: '#0f1419', weight: 2, fillColor: SEV[p.severity] || '#8b98a5', fillOpacity: p.current ? 1 : .55 });
    m.bindPopup(`<div class="pin-pop"><b>${p.severity}</b> pothole, ${(p.confidence * 100).toFixed(0)}% confident<br>${new Date(p.ts).toLocaleString()}` +
      `${p.current ? '' : ' (earlier run)'}${p.image ? `<img src="/pins/${p.id}.jpg" alt="detection">` : ''}</div>`);
    m.addTo(pinLayer);
  }
  $('count').textContent = pins.filter(p => p.current).length;
}

let pinsBusy = false;
async function refreshPins(runCount) {
  const key = runCount + ':' + Math.floor(Date.now() / 10000);   // on a new pin, and every 10 s
  if (key === pinKey || pinsBusy) return;
  pinKey = key; pinsBusy = true;
  try {
    const pins = await (await fetch('/api/pins', { cache: 'no-store' })).json();
    showPins(pins);
    $('saved').textContent = pins.length;
  } catch (e) {} finally { pinsBusy = false; }
}

async function tick() {
  try {
    last = await (await fetch('/api/state', { cache: 'no-store' })).json();
    render(last);
  } catch (e) {
    chip('chip-gps', 'Dashboard', 'bad', 'server unreachable');
  }
}
tick(); setInterval(tick, 250);

// Redraw immediately when the window resizes or moves to a screen with a different pixel ratio.
new ResizeObserver(() => { map.invalidateSize(); last && render(last); }).observe(document.body);
matchMedia(`(resolution: ${devicePixelRatio}dppx)`).addEventListener('change', () => location.reload(), { once: true });

function fullscreen() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
$('fs').onclick = fullscreen;
addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') fullscreen(); });
</script>
</body>
</html>
